<svg width="100%" height="100%" viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="650" fill="#f1f1f1"/>

  <!-- ========== MAIN LOGO RECTANGLE (occupies > 1/4 of page area) ========== -->
  <!-- Rectangle dimensions: 700 x 300 = 210,000; canvas area: 800 x 650 = 520,000; ratio = 40.4% -->
  <rect x="50" y="50" width="700" height="300" rx="10" fill="none" stroke="#4a6fa5" stroke-width="12"/>

  <!-- Inner decorative border -->
  <rect x="65" y="65" width="670" height="270" rx="6" fill="none" stroke="#4a6fa5" stroke-width="2"/>

  <!-- Crest Shield (Bolder) -->
  <path d="M100,90 
           L250,90 
           L250,230 
           Q175,300 100,230 Z"
        fill="#6f1428" stroke="white" stroke-width="3"/>

  <!-- Inner Bold Circle -->
  <circle cx="175" cy="175" r="55" fill="none" stroke="white" stroke-width="4"/>

  <!-- Book Icon (Bold) -->
  <rect x="150" y="155" width="25" height="35" fill="white"/>
  <rect x="175" y="155" width="25" height="35" fill="white"/>
  <line x1="175" y1="155" x2="175" y2="190" stroke="#6f1428" stroke-width="3"/>

  <!-- Crest Text -->
  <text x="175" y="125" font-size="12" fill="white" text-anchor="middle"
        font-family="Arial Black, Arial" font-weight="bold">
    OLA OLUWA
  </text>

  <text x="175" y="215" font-size="10" fill="white" text-anchor="middle"
        font-family="Arial Black, Arial" font-weight="bold">
    MUSLIM GRAMMAR SCHOOL
  </text>

  <text x="175" y="230" font-size="10" fill="white" text-anchor="middle"
        font-family="Arial Black, Arial" font-weight="bold">
    ADO-EKITI
  </text>

  <!-- Main Title (Extra Bold) -->
  <text x="580" y="150" font-size="48" text-anchor="middle"
        fill="#a61c1c"
        font-family="Impact, Arial Black, sans-serif"
        font-weight="900"
        letter-spacing="2">
    OLA - OLUWA
  </text>

  <text x="580" y="220" font-size="44" text-anchor="middle"
        fill="#a61c1c"
        font-family="Impact, Arial Black, sans-serif"
        font-weight="900"
        letter-spacing="2">
    MUSLIM GRAMMAR
  </text>

  <text x="580" y="280" font-size="44" text-anchor="middle"
        fill="#a61c1c"
        font-family="Impact, Arial Black, sans-serif"
        font-weight="900"
        letter-spacing="2">
    SCHOOL
  </text>

  <text x="580" y="330" font-size="36" text-anchor="middle"
        fill="#a61c1c"
        font-family="Impact, Arial Black, sans-serif"
        font-weight="900"
        letter-spacing="3">
    ADO-EKITI
  </text>

  <!-- ========== BOTTOM ARC WITH MOTTO (curving inward/upward) ========== -->
  <!-- Arc path: upward curve (smile) below the rectangle -->
  <path id="mottoArc" d="M 100 400 Q 400 520 700 400" fill="none" stroke="#a61c1c" stroke-width="4"/>

  <!-- Motto text along the arc -->
  <text fill="#a61c1c" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" letter-spacing="2">
    <textPath href="#mottoArc" startOffset="50%" text-anchor="middle">
      KNOWLEDGE IS THE BEGINNING OF FORTUNE
    </textPath>
  </text>

  <!-- Small decorative elements -->
  <line x1="150" y1="390" x2="650" y2="390" stroke="#4a6fa5" stroke-width="2" stroke-dasharray="6,4"/>

</svg>